<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmos con javascript</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <section id="f-global">
        <h1>Algoritmos con javascript</h1>
        <p>David Santiago - Developer</p>
        <hr>
        <div class="con-botones">
            <!-- Algoritmos de estructuras secuenciales -->
            <button onclick="opBasicas()">Operaciones básicas</button>
            <button onclick="areaTriangulo()">Área de un triángulo</button>
            <button onclick="conversionUnidades()">Conversión de unidades</button>

            <!-- Algoritmos condicionales -->
            <button onclick="servicioMilitar()">Servicio militar obligatorio</button>
            <button onclick="mayor2n()">Mayor de dos números</button>
            <button onclick="parOImpar()">Par o impar</button>

            <!-- Estructuras de ciclos -->
            <button onmouseover="rangoNumeros()">Rango de números</button>
            <button onclick="sumaRango()">Suma de números</button>
            <button onclick="numeroPrimo()">Número primo</button>

            <!-- Complejidad Media (Arreglos y Objetos) -->
            <button onclick="conversionMoneda()">Conversión moneda</button>
            <button onclick="calcularPromedio()">Promedio calificaciones</button>
            <button onclick="consultarPeli()">Info películas</button>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
